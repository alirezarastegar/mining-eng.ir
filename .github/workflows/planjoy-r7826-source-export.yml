name: PlanJoy R7.8.26 Source Export

on:
  workflow_dispatch:
  push:
    branches: [tmp-planjoy-r7823-build]
    paths:
      - '.github/workflows/planjoy-r7826-source-export.yml'

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct R7.8.26 source
        shell: bash
        run: |
          set -euo pipefail
          cat planjoy-r7823-source/code/chunk*.b64 | base64 -d > /tmp/source.tar.xz
          echo '9bb1f3106dbcea0ec6812e5f3c336ac8c191d4f50df81355d0c70551ea6a0aa3  /tmp/source.tar.xz' | sha256sum -c -
          rm -rf android_native && mkdir android_native
          tar -xJf /tmp/source.tar.xz -C android_native
          python3 planjoy-r7823-source/r7823_compile_patch.py
          cat planjoy-r7824-source/patch-xz/part*.b64 | base64 -d > /tmp/r7824.patch.xz
          echo '180b2b928580d394a8dfb4c011a72dfc915d3820e7b72f52d0dd8e39452b0904  /tmp/r7824.patch.xz' | sha256sum -c -
          xz -dc /tmp/r7824.patch.xz > /tmp/r7824.patch
          patch --batch --forward -p1 -d android_native < /tmp/r7824.patch
          python3 planjoy-r7824-source/hotfix/compile-fix.py
          cat planjoy-r7824-source/final-patch/part*.b64 | base64 -d > /tmp/user2.patch.xz
          echo 'ee3fb65cf2ce5aca6620688cbc1d1a044fcceb24dfdc0d35020341f51d933e4d  /tmp/user2.patch.xz' | sha256sum -c -
          xz -dc /tmp/user2.patch.xz > /tmp/user2.patch
          patch --batch --forward -p1 -d android_native < /tmp/user2.patch
          python3 planjoy-r7824-source/final-compile-fix.py
          cat planjoy-r7825-source/patch2/part*.b64 | base64 -d > /tmp/r7825.patch.xz
          echo '609cf104135b31a3130fb253d998f83150aab2b2b08f43180b403f9b3fe5f94b  /tmp/r7825.patch.xz' | sha256sum -c -
          xz -dc /tmp/r7825.patch.xz > /tmp/r7825.patch
          patch --batch --forward -p1 -d android_native < /tmp/r7825.patch
          python3 planjoy-r7825-source/compile-fix.py
          cat planjoy-r7826-source/patch/part*.b64 | base64 -d > /tmp/r7826.patch.xz
          echo '59b608f7c8658417689846111a9cca450a5fe3d04e7954e4dcaffa5ccf9c56e4  /tmp/r7826.patch.xz' | sha256sum -c -
          xz -dc /tmp/r7826.patch.xz > /tmp/r7826.patch
          set +e
          patch --batch --forward -p1 -d android_native < /tmp/r7826.patch
          rc=$?
          set -e
          test "$rc" -eq 1
          test -f android_native/tests/r7823_windows_parity_contract.py.rej
          rm -f android_native/tests/r7823_windows_parity_contract.py.rej
          find android_native -type f -name '*.rej' -delete
          tar -czf planjoy-r7826-reconstructed-source.tar.gz android_native
          sha256sum planjoy-r7826-reconstructed-source.tar.gz > planjoy-r7826-reconstructed-source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: PlanJoy-R7826-Reconstructed-Source
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
          path: |
            planjoy-r7826-reconstructed-source.tar.gz
            planjoy-r7826-reconstructed-source.sha256

name: PlanJoy R7.3 Source Recovery Probe

on:
  push:
    branches: [tmp-planjoy-r73-final-delivery]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch historical source branches
        shell: bash
        run: |
          set -euxo pipefail
          git fetch --no-tags origin \
            tmp-planjoy-r73-desktop-ci2:refs/remotes/origin/tmp-planjoy-r73-desktop-ci2 \
            tmp-planjoy-r73-desktop-final-ci:refs/remotes/origin/tmp-planjoy-r73-desktop-final-ci

      - name: Inspect all recoverable desktop archives and parity patch
        shell: python
        run: |
          from pathlib import Path
          import base64, gzip, hashlib, io, json, lzma, re, subprocess, tarfile

          def git_text(ref, path):
              return subprocess.check_output(['git','show',f'{ref}:{path}'], text=True).strip()

          def inspect_archive(label, b64text, compression):
              print(f'=== {label} ===')
              print('base64_length', len(b64text), 'mod4', len(b64text)%4)
              eq=[i for i,c in enumerate(b64text) if c=='=']
              print('equals', eq[-20:])
              try:
                  raw=base64.b64decode(b64text, validate=True)
              except Exception as e:
                  print('BASE64_FAIL', repr(e)); return
              print('decoded_length', len(raw), 'sha256', hashlib.sha256(raw).hexdigest(), 'head', raw[:12].hex())
              try:
                  if compression=='gz':
                      data=gzip.decompress(raw)
                  else:
                      data=lzma.decompress(raw)
                  print('decompressed_length', len(data), 'sha256', hashlib.sha256(data).hexdigest())
                  with tarfile.open(fileobj=io.BytesIO(data), mode='r:') as tf:
                      names=tf.getnames()
                      print('tar_members', len(names))
                      print('tar_first', names[:15])
                      print('tar_last', names[-15:])
              except Exception as e:
                  print('ARCHIVE_FAIL', type(e).__name__, repr(e))
                  try:
                      mode='r:gz' if compression=='gz' else 'r:xz'
                      with tarfile.open(fileobj=io.BytesIO(raw), mode=mode, errorlevel=0) as tf:
                          names=[]
                          while True:
                              try:
                                  m=tf.next()
                                  if m is None: break
                                  names.append((m.name,m.size))
                              except Exception as inner:
                                  print('PARTIAL_TAR_STOP', type(inner).__name__, repr(inner)); break
                          print('partial_members', len(names), 'last', names[-20:])
                  except Exception as e2:
                      print('PARTIAL_OPEN_FAIL', type(e2).__name__, repr(e2))

          # Historical base archive from ci2.
          ref='origin/tmp-planjoy-r73-desktop-ci2'
          listing=subprocess.check_output(['git','ls-tree','-r','--name-only',ref,'planjoy-r73-desktop'], text=True).splitlines()
          parts=sorted([p for p in listing if p.endswith('.b64')], key=lambda p:int(re.search(r'(\d+)',Path(p).stem).group(1)))
          print('CI2_PARTS', [(Path(p).name,len(git_text(ref,p))) for p in parts])
          ci2=''.join(git_text(ref,p) for p in parts)
          inspect_archive('ci2-natural-order',ci2,'gz')

          # Reorder the oversized part05 tail as the beginning of missing part07.
          texts={Path(p).name:git_text(ref,p) for p in parts}
          if 'part05.b64' in texts:
              p5=texts['part05.b64']
              head=p5[:14000]; extra=p5[14000:]
              names=['part00.b64','part01.b64','part02.b64','part03.b64','part04.b64']
              candidate=''.join(texts[n] for n in names)+head+texts.get('part06.b64','')+extra+texts.get('part08.b64','')+texts.get('part09.b64','')+texts.get('part10.b64','')
              print('part05_head',len(head),'part05_extra',len(extra))
              inspect_archive('ci2-part05-extra-after-part06',candidate,'gz')

          # Current full archive, replacing the known bad tail50 upload with its deterministic corrected split.
          root=Path('planjoy-r73-desktop-v3')
          order=['part00.b64','part01.b64','part02.b64','tail50.b64','miss00.b64','miss01.b64','miss02.b64','miss03.b64','gap03.b64','miss04.b64','miss05.b64','miss06.b64','gap-last.b64']
          cur={n:(root/n).read_text().strip() for n in order}
          fixed_tail=''.join((root/'correct'/n).read_text().strip() for n in ['tail50-00.b64','tail50-01.b64','tail50-02.b64'])
          print('fixed_tail_length',len(fixed_tail), 'sha256',hashlib.sha256(fixed_tail.encode()).hexdigest())
          cur['tail50.b64']=fixed_tail
          v3=''.join(cur[n] for n in order)
          print('v3_before_repair_equals',[i for i,c in enumerate(v3) if c=='='])
          if len(v3)==200124:
              v3=v3[:89256]+'h'+v3[89257:]
              v3=v3[:190790]+'N'+v3[190791:]
          inspect_archive('v3-correct-tail-current-miss05',v3,'xz')

          # Decode and list the professional parity patch so its base contract is explicit.
          patch_b64=Path('planjoy-r73-desktop-final-patch/source-patch.gz.b64').read_text().strip()
          patch_raw=base64.b64decode(patch_b64)
          print('PATCH_GZ_SHA256',hashlib.sha256(patch_raw).hexdigest(),'length',len(patch_raw))
          patch=gzip.decompress(patch_raw).decode('utf-8','replace')
          print('PATCH_LENGTH',len(patch),'PATCH_SHA256',hashlib.sha256(patch.encode()).hexdigest())
          for line in patch.splitlines():
              if line.startswith(('diff --git ','--- ','+++ ','@@ ')):
                  print('PATCH_META',line)

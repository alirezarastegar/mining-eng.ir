name: PlanJoy R7.2 Android Offline Toolchain
on:
  push:
    branches: [tmp-planjoy-r72-toolchain]
  workflow_dispatch:
jobs:
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Reconstruct R7.1 qualified Android source
        shell: bash
        run: |
          set -euxo pipefail
          git fetch --depth=1 origin tmp-planjoy-r7-build
          git checkout FETCH_HEAD -- planjoy-r7-source
          cat planjoy-r7-source/chunk*.b64 > planjoy-r7-source/source.b64
          base64 -d planjoy-r7-source/source.b64 > planjoy-r7-base.tar.gz
          echo '36dd8324b4d54e3dcacff3a6d28e2b6bb6153efcf54e337c99226cf1fdeadf11  planjoy-r7-base.tar.gz' | sha256sum -c -
          tar -xzf planjoy-r7-base.tar.gz
          git fetch --depth=1 origin tmp-planjoy-ux-ci
          git checkout FETCH_HEAD -- planjoy-r71-ux
          cat planjoy-r71-ux/patch_chunks/chunk*.b64 > planjoy-r71-ux/patch-full.b64
          base64 -d planjoy-r71-ux/patch-full.b64 > planjoy-r71-ux/patch.tar.gz
          echo '2e0a60663c32d9d86b7a7f9437d86627b073df70a1a03263e1156648b809b219  planjoy-r71-ux/patch.tar.gz' | sha256sum -c -
          tar -xzf planjoy-r71-ux/patch.tar.gz
          base64 -d planjoy-r71-ux/overlay-final.tar.gz.b64 > planjoy-r71-ux/overlay-final.tar.gz
          echo 'edbe3843237b516153f1eb475d4f6846bf8bc82c59df69e2ff1bdf158b6985b5  planjoy-r71-ux/overlay-final.tar.gz' | sha256sum -c -
          tar -xzf planjoy-r71-ux/overlay-final.tar.gz
          mkdir -p android_native/app/src/main/res/font
          base64 -d planjoy-r71-ux/font-placeholder.ttf.b64 > android_native/app/src/main/res/font/iransans_xv.ttf
          test -f android_native/app/src/main/java/com/planjoy/r7/AppUi.kt
      - name: Resolve all Android and Compose dependencies
        working-directory: android_native
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease :app:lintDebug
      - name: Package offline build toolchain
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p offline-toolchain/android-sdk/platforms offline-toolchain/android-sdk/build-tools offline-toolchain/android-sdk/platform-tools offline-toolchain/gradle-cache
          GRADLE_BIN=$(readlink -f "$(command -v gradle)")
          GRADLE_HOME=$(dirname "$(dirname "$GRADLE_BIN")")
          echo "$GRADLE_HOME" > offline-toolchain/gradle-home.txt
          cp -a "$GRADLE_HOME" offline-toolchain/gradle-9.5.0
          cp -a "$ANDROID_HOME/platforms/android-37" offline-toolchain/android-sdk/platforms/
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          cp -a "$BT" offline-toolchain/android-sdk/build-tools/
          cp -a "$ANDROID_HOME/platform-tools/." offline-toolchain/android-sdk/platform-tools/
          cp -a "$HOME/.gradle/caches/." offline-toolchain/gradle-cache/
          printf 'android_home=%s\nbuild_tools=%s\ngradle_home=%s\n' "$ANDROID_HOME" "$BT" "$GRADLE_HOME" > offline-toolchain/metadata.txt
          du -sh offline-toolchain/*
      - uses: actions/upload-artifact@v4
        with:
          name: PlanJoyR72-Android-offline-toolchain
          path: offline-toolchain
          compression-level: 6
          retention-days: 1

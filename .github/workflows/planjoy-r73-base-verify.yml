name: PlanJoy R7.3 Base Source Verify

on:
  push:
    branches: [tmp-planjoy-r73-final-delivery]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover and verify the complete v2 desktop base archive
        shell: bash
        run: |
          set -euxo pipefail
          git fetch --no-tags origin tmp-planjoy-r73-desktop-ci2:refs/remotes/origin/tmp-planjoy-r73-desktop-ci2
          rm -rf recovered && mkdir recovered
          for n in 00 01 02 03 04 05; do
            git show "origin/tmp-planjoy-r73-desktop-ci2:planjoy-r73-desktop/part${n}.b64" >> recovered/base.b64
          done
          tr -d '\r\n ' < recovered/base.b64 | base64 -d > recovered/base.tar.gz
          wc -c recovered/base.b64 recovered/base.tar.gz
          sha256sum recovered/base.tar.gz
          tar -tzf recovered/base.tar.gz | tee recovered/members.txt
          test "$(sha256sum recovered/base.tar.gz | awk '{print $1}')" = "aaa71b397b3b0d1d0f17ce81ba25918dbd905d83b71fc71dbe23d2a09b6e3ad6"
          grep -q '^desktop_electron/package.json$' recovered/members.txt
          grep -q '^desktop_electron/renderer/app.js$' recovered/members.txt
          grep -q '^desktop_electron/installer/main.go$' recovered/members.txt

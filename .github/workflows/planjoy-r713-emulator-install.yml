name: PlanJoy R7.1.3 Android Emulator Install Gate
on:
  push:
    branches: [tmp-planjoy-r713-parity]
    paths:
      - '.github/workflows/planjoy-r713-emulator-install.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-planjoy-r713-parity
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Ensure APK exists
        shell: bash
        run: |
          if [ ! -s planjoy-r713-ci-output/PlanJoyR713-CI-placeholder-font.apk ]; then bash planjoy-r713-gen/build_r713.sh; fi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch on Android emulator
        id: emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euxo pipefail
            APK=planjoy-r713-ci-output/PlanJoyR713-CI-placeholder-font.apk
            adb install -r "$APK" | tee emulator-install.log
            adb shell am start -W -n app.planjoy.local/com.planjoy.r7.R713MainActivity | tee emulator-launch.log
            sleep 5
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity|app.planjoy.local' | tee emulator-resumed.log
            adb shell uiautomator dump /sdcard/planjoy-ui.xml || true
            adb pull /sdcard/planjoy-ui.xml planjoy-ui.xml || true
            adb exec-out screencap -p > planjoy-emulator.png
            grep -q 'app.planjoy.local' emulator-resumed.log
            printf 'PASS\ninstall=PASS\nlaunch=PASS\napi=35\n' > android-runtime-status.txt
      - name: Record failure
        if: steps.emulator.outcome != 'success'
        run: |
          printf 'FAIL\ninstall_or_launch=FAIL\n' > android-runtime-status.txt
      - name: Publish runtime evidence
        if: always()
        shell: bash
        run: |
          mkdir -p planjoy-r713-runtime-output
          cp android-runtime-status.txt planjoy-r713-runtime-output/ || true
          cp emulator-install.log emulator-launch.log emulator-resumed.log planjoy-ui.xml planjoy-emulator.png planjoy-r713-runtime-output/ 2>/dev/null || true
          git config user.name 'PlanJoy CI'
          git config user.email 'planjoy-ci@users.noreply.github.com'
          git add planjoy-r713-runtime-output
          git commit -m '[r713-runtime] publish emulator install gate' || exit 0
          git push origin HEAD:tmp-planjoy-r713-parity

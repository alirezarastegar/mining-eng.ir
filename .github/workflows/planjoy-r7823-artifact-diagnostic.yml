name: PlanJoy R7.8.23 Prior Artifact Diagnostic
on:
  workflow_dispatch:
  push:
    branches: [tmp-planjoy-r7823-build]
    paths: ['.github/workflows/planjoy-r7823-artifact-diagnostic.yml']
permissions:
  actions: read
  contents: read
jobs:
  find:
    runs-on: ubuntu-24.04
    steps:
      - name: List recent PlanJoy artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for page in 1 2 3 4 5; do
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100&page=$page" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); [print(a["id"],a["name"],a.get("expired"),a.get("created_at"),a.get("workflow_run",{}).get("id")) for a in d.get("artifacts",[]) if "planjoy" in a["name"].lower() or "7822" in a["name"].lower()]'
          done

name: PlanJoy R7.8.23 Android Full-Parity Build

on:
  workflow_dispatch:
  push:
    branches: [tmp-planjoy-r7823-build]
    paths:
      - '.github/workflows/planjoy-r7823-build.yml'
      - 'planjoy-r7823-source/**'

jobs:
  android-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36 / Build Tools 36.0.0
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Reconstruct R7.1.3 overlay base
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin tmp-planjoy-r713-parity
          git checkout FETCH_HEAD -- planjoy-r713-v2
          cat planjoy-r713-v2/seg*.b64 > planjoy-r713-v2/overlay.b64
          base64 -d planjoy-r713-v2/overlay.b64 > planjoy-r713-v2/overlay.tar.gz
          echo '79cc1b24ac0813710a161139ccd283fa3fcb3ff6b34aeec8d0766d959c3b87ab  planjoy-r713-v2/overlay.tar.gz' | sha256sum -c -
          mkdir -p android_native
          tar -xzf planjoy-r713-v2/overlay.tar.gz -C android_native
          find android_native -maxdepth 3 -type f | sort | head -200
          test -f android_native/app/build.gradle.kts
          test -f android_native/settings.gradle.kts

      - name: Apply tested R7.8.23 delta and SDK compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          cat planjoy-r7823-source/code/chunk*.b64 > planjoy-r7823-source/code/delta.b64
          base64 -d planjoy-r7823-source/code/delta.b64 > planjoy-r7823-source/code/delta.tar.xz
          echo '9bb1f3106dbcea0ec6812e5f3c336ac8c191d4f50df81355d0c70551ea6a0aa3  planjoy-r7823-source/code/delta.tar.xz' | sha256sum -c -
          tar -xJf planjoy-r7823-source/code/delta.tar.xz -C android_native
          sed -i 's/compileSdk=37/compileSdk=36/g; s/targetSdk=37/targetSdk=36/g' android_native/app/build.gradle.kts
          grep -q 'versionCode=78023' android_native/app/build.gradle.kts
          grep -q 'versionName="0.7.8+23"' android_native/app/build.gradle.kts

      - name: Verify exact artwork hashes
        shell: bash
        run: |
          set -euo pipefail
          echo 'c73988887cf3f7033c6e51a5ec2e5af14d65524e4ce255ead4bd9a91633754fb  android_native/app/src/main/res/drawable/pj_original_today_header.png' | sha256sum -c -
          echo 'e749941257577e20a6906e5352895fcb3fccbf674ad4215d4f3f8a7eef516cad  android_native/app/src/main/res/drawable/pj_original_calendar.png' | sha256sum -c -
          echo '735973c5f01c88a6a85b81668e077e5aa39abdc11f523eb8628fb2745d8b9dc3  android_native/app/src/main/res/drawable/pj_original_focus_scene.webp' | sha256sum -c -
          echo '746d865ed85ce0f9b6d60b790d2685e7e217e205de537c23d6e2eb12f4fb46b7  android_native/app/src/main/res/drawable/pj_original_focus_stats.png' | sha256sum -c -
          echo '1eff77f0c7c065fd518e41116abf2377182d0d564aa165e8745cca90c60b1c48  android_native/app/src/main/res/drawable/pj_original_task_ducks.webp' | sha256sum -c -

      - name: Verify R7.8.23 feature contracts
        working-directory: android_native
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/r7821_android_static_contract.py
          python3 tests/r78_android_native_contract.py
          python3 tests/r7823_windows_parity_contract.py

      - name: Build unsigned production release and lint
        working-directory: android_native
        shell: bash
        env:
          PLANJOY_ANDROID_KEYSTORE: ''
          PLANJOY_ANDROID_STORE_PASSWORD: ''
          PLANJOY_ANDROID_KEY_ALIAS: ''
          PLANJOY_ANDROID_KEY_PASSWORD: ''
        run: |
          set -euo pipefail
          gradle clean :app:assembleProductionRelease :app:lintProductionRelease --no-daemon --no-build-cache --stacktrace
          test -f app/build/reports/lint-results-productionRelease.txt
          ! grep -q ': Error:' app/build/reports/lint-results-productionRelease.txt

      - name: Align and verify package/version before private signing
        working-directory: android_native
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/production/release -name '*.apk' -type f | head -1)
          test -n "$APK" && test -f "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -f -P 16 -v 4 "$APK" ../PlanJoyR7823-Android-v0.7.8.23-UNSIGNED-ALIGNED.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -P 16 -v 4 ../PlanJoyR7823-Android-v0.7.8.23-UNSIGNED-ALIGNED.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2" dump badging ../PlanJoyR7823-Android-v0.7.8.23-UNSIGNED-ALIGNED.apk | tee ../r7823-badging.txt
          grep -q "package: name='app.planjoy.local' versionCode='78023' versionName='0.7.8+23'" ../r7823-badging.txt
          sha256sum ../PlanJoyR7823-Android-v0.7.8.23-UNSIGNED-ALIGNED.apk | tee ../PlanJoyR7823-Android-UNSIGNED-SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PlanJoy-R7823-Android-unsigned-aligned
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
          path: |
            PlanJoyR7823-Android-v0.7.8.23-UNSIGNED-ALIGNED.apk
            PlanJoyR7823-Android-UNSIGNED-SHA256.txt
            r7823-badging.txt
            android_native/app/build/reports/lint-results-productionRelease.html
            android_native/app/build/reports/lint-results-productionRelease.txt

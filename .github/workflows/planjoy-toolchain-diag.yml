name: PlanJoy Toolchain Diagnostic
on:
  push:
    branches: [ planjoy-toolchain-20260831 ]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose public Android toolchain
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/diag
          { echo ANDROID_HOME=$ANDROID_HOME; echo ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT; command -v sdkmanager; find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager -print 2>/dev/null | head -10; java -version; } > /tmp/diag/diag.txt 2>&1
          SDKM=$(command -v sdkmanager); if [ -z "$SDKM" ]; then SDKM=$(find "$ANDROID_HOME" -type f -name sdkmanager -print -quit 2>/dev/null); fi
          echo SDKM=$SDKM >> /tmp/diag/diag.txt
          if [ -n "$SDKM" ]; then "$SDKM" --list 2>&1 | grep -E 'platforms;android-37|build-tools;36.0.0' >> /tmp/diag/diag.txt; fi
          curl -fL --retry 2 https://services.gradle.org/distributions/gradle-9.5.0-bin.zip -o /tmp/gradle.zip >> /tmp/diag/diag.txt 2>&1
          echo CURL=$? >> /tmp/diag/diag.txt
          sha256sum /tmp/gradle.zip >> /tmp/diag/diag.txt 2>&1
          cat /tmp/diag/diag.txt
      - uses: actions/upload-artifact@v4
        with:
          name: planjoy-toolchain-diag
          path: /tmp/diag/diag.txt
          retention-days: 1

name: PlanJoy R7 Android Build
on:
  push:
    branches: [tmp-planjoy-r7-build]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Reconstruct isolated source
        shell: bash
        run: |
          cat planjoy-r7-source/chunk*.b64 > planjoy-r7-source/source.b64
          base64 -d planjoy-r7-source/source.b64 > planjoy-r7-android-source.tar.gz
          echo '36dd8324b4d54e3dcacff3a6d28e2b6bb6153efcf54e337c99226cf1fdeadf11  planjoy-r7-android-source.tar.gz' | sha256sum -c -
          tar -xzf planjoy-r7-android-source.tar.gz
          test -f android_native/app/src/main/java/com/planjoy/r7/MainActivity.kt
      - name: Build and lint
        working-directory: android_native
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:lintDebug
      - name: Verify package
        shell: bash
        run: |
          test -f android_native/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android_native/app/build/outputs/apk/debug/app-debug.apk | tee PlanJoyR7-APK-SHA256.txt
          printf 'compileSdk=37\ntargetSdk=37\nversion=0.7.0\n' > PlanJoyR7-build-metadata.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PlanJoyR7-Android-debug
          path: |
            android_native/app/build/outputs/apk/debug/app-debug.apk
            android_native/app/build/reports/lint-results-debug.html
            android_native/app/build/reports/lint-results-debug.txt
            PlanJoyR7-APK-SHA256.txt
            PlanJoyR7-build-metadata.txt
          retention-days: 7

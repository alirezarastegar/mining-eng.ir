name: R12.6.3 External Worker Certification

on:
  push:
    branches:
      - r1263-external-worker-cert
    paths:
      - ".github/workflows/r1263-external-worker.yml"
      - "tools/r1263_external_worker.py"

permissions:
  contents: read
  id-token: write

concurrency:
  group: r1263-external-worker-cert
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Seed isolated burn-in queue
        env:
          MODE: seed
          BURNIN_JOBS: "48"
        run: python tools/r1263_external_worker.py

  fleet:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        worker: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - name: Run external Python worker
        env:
          MODE: worker
          WORKER_ID: gh-worker-${{ matrix.worker }}
          BURNIN_SECONDS: "90"
          BURNIN_JOBS: "48"
        run: python tools/r1263_external_worker.py

  verify:
    if: always()
    needs: [setup, fleet]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify, certify, and clean test queue
        env:
          MODE: verify
          WORKER_ID: verify
          BURNIN_SECONDS: "90"
          BURNIN_JOBS: "48"
        run: python tools/r1263_external_worker.py

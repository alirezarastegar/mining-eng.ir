name: PlanJoy R7.8.28 Gradle Binary Export

on:
  push:
    branches: [tmp-planjoy-r7828-build]
    paths:
      - '.github/workflows/planjoy-r7828-gradle-bin.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Package Gradle distribution
        shell: bash
        run: |
          set -euo pipefail
          G=$(readlink -f "$(command -v gradle)")
          echo "GRADLE_BIN=$G"
          HOME_DIR=$(cd "$(dirname "$G")/.." && pwd)
          test -x "$HOME_DIR/bin/gradle"
          tar -cJf PlanJoy-Gradle-9.5.0.tar.xz -C "$HOME_DIR" .
          sha256sum PlanJoy-Gradle-9.5.0.tar.xz > PlanJoy-Gradle-9.5.0.sha256
          ls -lh PlanJoy-Gradle-9.5.0.tar.xz
      - uses: actions/upload-artifact@v4
        with:
          name: PlanJoy-Gradle-9.5.0
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
          path: |
            PlanJoy-Gradle-9.5.0.tar.xz
            PlanJoy-Gradle-9.5.0.sha256

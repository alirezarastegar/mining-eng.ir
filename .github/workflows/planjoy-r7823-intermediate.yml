name: PlanJoy R7.8.23 Secure Unsigned Intermediate

on:
  workflow_dispatch:
  push:
    branches: [tmp-planjoy-r7823-build]
    paths:
      - '.github/workflows/planjoy-r7823-intermediate.yml'
      - 'planjoy-r7823-source/r7823_compile_patch.py'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 37.0 / Build Tools 37.0.0
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --channel=3 'platform-tools' 'platforms;android-37.0' 'build-tools;37.0.0'
          test -f "$ANDROID_SDK_ROOT/platforms/android-37.0/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/37.0.0/aapt2"
          if [ ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            ln -s "$ANDROID_SDK_ROOT/platforms/android-37.0" "$ANDROID_SDK_ROOT/platforms/android-37"
          fi
          test -f "$ANDROID_SDK_ROOT/platforms/android-37/android.jar"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Reconstruct exact verified R7.8.23 source
        shell: bash
        run: |
          set -euo pipefail
          cat planjoy-r7823-source/code/chunk*.b64 > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/source.tar.xz
          echo '9bb1f3106dbcea0ec6812e5f3c336ac8c191d4f50df81355d0c70551ea6a0aa3  /tmp/source.tar.xz' | sha256sum -c -
          xz -t /tmp/source.tar.xz
          rm -rf android_native && mkdir android_native
          tar -xJf /tmp/source.tar.xz -C android_native
          grep -Eq 'compileSdk[[:space:]]*=[[:space:]]*37' android_native/app/build.gradle.kts
          grep -Eq 'versionCode[[:space:]]*=[[:space:]]*78023' android_native/app/build.gradle.kts
          grep -Eq 'versionName[[:space:]]*=[[:space:]]*"0\.7\.8\+23"' android_native/app/build.gradle.kts

      - name: Verify original Windows parity contract 15/15
        working-directory: android_native
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/font
          SYSFONT=$(find /usr/share/fonts -type f \( -iname '*.ttf' -o -iname '*.otf' \) | head -1)
          test -n "$SYSFONT" && test -s "$SYSFONT"
          cp "$SYSFONT" app/src/main/res/font/iransans_xv.ttf
          python3 tests/r7823_windows_parity_contract.py | tee ../r7823-parity.txt
          grep -q 'SUMMARY 15/15 PASS' ../r7823-parity.txt

      - name: Apply strict compile fixes and four-unique-priority-art binding
        shell: bash
        run: |
          set -euo pipefail
          python3 planjoy-r7823-source/r7823_compile_patch.py
          grep -q 'object CutePalette' android_native/app/src/main/java/com/planjoy/r7/AppUi.kt
          grep -q 'import java.time.Instant' android_native/app/src/main/java/com/planjoy/r7/R78Features.kt
          ! grep -q 'private fun Focus(c:Context,f:Boolean)=R78FocusScreen(c,f)' android_native/app/src/main/java/com/planjoy/r7/AppUi.kt
          grep -q 'pj_priority_clock_duck' android_native/app/src/main/java/com/planjoy/r7/R72Features.kt
          grep -q 'pj_priority_focus_duck' android_native/app/src/main/java/com/planjoy/r7/R72Features.kt
          grep -q 'pj_priority_first_plan' android_native/app/src/main/java/com/planjoy/r7/R72Features.kt
          grep -q 'pj_priority_analysis' android_native/app/src/main/java/com/planjoy/r7/R72Features.kt

      - name: Create replaceable CI-only binary resource placeholders
        shell: bash
        run: |
          set -euo pipefail
          D=android_native/app/src/main/res/drawable
          R=android_native/app/src/main/res/raw
          mkdir -p "$D" "$R"
          PNG='iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAFUlEQVR4nGP8////fwYGBgYmBigAAD34BADaOyqcAAAAAElFTkSuQmCC'
          WEBP='UklGRiQAAABXRUJQVlA4IBgAAAAwAQCdASoCAAIAAUAmJaQAA3AA/vz0AAA='
          for n in pj_original_today_header pj_original_calendar pj_original_focus_stats pj_priority_clock_duck pj_priority_focus_duck pj_priority_analysis; do printf '%s' "$PNG" | base64 -d > "$D/$n.png"; done
          for n in pj_original_focus_scene pj_original_task_ducks pj_priority_first_plan; do printf '%s' "$WEBP" | base64 -d > "$D/$n.webp"; done
          python3 - <<'PY'
          import wave, struct
          from pathlib import Path
          root=Path('android_native/app/src/main/res/raw'); root.mkdir(parents=True,exist_ok=True)
          for name in ['complete','focus_end','focus_start','page_turn','pause','reward_chime','soft_bell','soft_pop']:
              with wave.open(str(root/(name+'.wav')),'wb') as w:
                  w.setnchannels(1); w.setsampwidth(2); w.setframerate(8000); w.writeframes(struct.pack('<h',0)*80)
          PY
          find android_native/app/src/main/res/drawable -maxdepth 1 -type f -name 'pj_*' -print | sort
          find android_native/app/src/main/res/raw -maxdepth 1 -type f -print | sort

      - name: Build and lint production release
        working-directory: android_native
        shell: bash
        run: |
          set -euo pipefail
          gradle clean :app:compileProductionReleaseKotlin :app:assembleProductionRelease :app:lintProductionRelease --no-daemon --no-build-cache --stacktrace
          test -f app/build/reports/lint-results-productionRelease.txt
          ! grep -q ': Error:' app/build/reports/lint-results-productionRelease.txt
          APK=$(find app/build/outputs/apk/production/release -name '*.apk' -type f | head -1)
          test -n "$APK" && test -f "$APK"
          "$ANDROID_SDK_ROOT/build-tools/37.0.0/zipalign" -f -P 16 -v 4 "$APK" ../PlanJoyR7823-Android-INTERMEDIATE-ALIGNED.apk
          "$ANDROID_SDK_ROOT/build-tools/37.0.0/zipalign" -c -P 16 -v 4 ../PlanJoyR7823-Android-INTERMEDIATE-ALIGNED.apk
          "$ANDROID_SDK_ROOT/build-tools/37.0.0/aapt2" dump badging ../PlanJoyR7823-Android-INTERMEDIATE-ALIGNED.apk | tee ../r7823-intermediate-badging.txt
          grep -q "package: name='app.planjoy.local' versionCode='78023' versionName='0.7.8+23'" ../r7823-intermediate-badging.txt

      - name: Package Build Tools needed for private finalization
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_SDK_ROOT/build-tools/37.0.0"
          mkdir -p toolpack/lib
          cp "$BT/apksigner" "$BT/zipalign" "$BT/aapt2" toolpack/
          cp "$BT/lib/apksigner.jar" toolpack/lib/
          chmod +x toolpack/apksigner toolpack/zipalign toolpack/aapt2
          tar -czf PlanJoy-Android-BuildTools37-Linux.tar.gz -C toolpack .

      - name: Package corrected source skeleton without CI placeholders
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/PlanJoyR7823-Android-Source"
          rm -rf "$OUT" && cp -a android_native "$OUT"
          find "$OUT" -type d \( -name build -o -name .gradle \) -prune -exec rm -rf {} +
          find "$OUT" -type f \( -iname '*.ttf' -o -iname '*.otf' -o -iname '*.p12' -o -iname '*.pfx' -o -iname '*.jks' -o -iname '*.keystore' \) -delete
          rm -f "$OUT/app/src/main/res/drawable/pj_original_today_header.png" "$OUT/app/src/main/res/drawable/pj_original_calendar.png" "$OUT/app/src/main/res/drawable/pj_original_focus_stats.png" "$OUT/app/src/main/res/drawable/pj_original_focus_scene.webp" "$OUT/app/src/main/res/drawable/pj_original_task_ducks.webp"
          rm -f "$OUT/app/src/main/res/drawable/pj_priority_clock_duck.png" "$OUT/app/src/main/res/drawable/pj_priority_focus_duck.png" "$OUT/app/src/main/res/drawable/pj_priority_first_plan.webp" "$OUT/app/src/main/res/drawable/pj_priority_analysis.png"
          rm -rf "$OUT/app/src/main/res/raw"
          cat > "$OUT/FONT-ASSET-NOT-INCLUDED.md" <<'EOF'
          # Font asset
          The authorized binary font is intentionally omitted from this source distribution.
          Production expects app/src/main/res/font/iransans_xv.ttf.
          EOF
          cat > "$OUT/RESOURCE-ASSETS-PENDING-PRIVATE-FINALIZATION.md" <<'EOF'
          # Binary resource finalization
          CI compiled with disposable same-name placeholders. The final delivery process replaces them with SHA-verified canonical PlanJoy images, sounds and four distinct priority artworks before signing, and injects those canonical non-font resources into the delivered clean source archive.
          EOF
          (cd "$RUNNER_TEMP" && zip -qr "$GITHUB_WORKSPACE/PlanJoyR7823-Android-Source-Skeleton.zip" PlanJoyR7823-Android-Source)
          sha256sum PlanJoyR7823-Android-Source-Skeleton.zip > PlanJoyR7823-Android-Source-Skeleton-SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PlanJoy-R7823-Intermediate
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
          path: |
            PlanJoyR7823-Android-INTERMEDIATE-ALIGNED.apk
            PlanJoy-Android-BuildTools37-Linux.tar.gz
            PlanJoyR7823-Android-Source-Skeleton.zip
            PlanJoyR7823-Android-Source-Skeleton-SHA256.txt
            r7823-parity.txt
            r7823-intermediate-badging.txt
            android_native/app/build/reports/lint-results-productionRelease.txt
            android_native/app/build/reports/lint-results-productionRelease.html

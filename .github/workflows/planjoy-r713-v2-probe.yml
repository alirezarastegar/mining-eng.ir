name: PlanJoy R7.1.3 v2 Source Probe
on:
  push:
    branches: [tmp-planjoy-r73-ci]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch R7.1.3 source chunks and inspect
        shell: bash
        run: |
          set -euxo pipefail
          git fetch --depth=1 origin tmp-planjoy-r713-parity
          git checkout FETCH_HEAD -- planjoy-r713-v2
          cat planjoy-r713-v2/seg*.b64 > r713.b64
          base64 -d r713.b64 > r713.tar.gz
          file r713.tar.gz
          gzip -t r713.tar.gz
          sha256sum r713.tar.gz
          mkdir out
          tar -xzf r713.tar.gz -C out
          find out -maxdepth 6 -type f | sort | head -150
          test -n "$(find out -name build.gradle.kts -print -quit)"
          test -n "$(find out -name AppUi.kt -print -quit)"
          test -n "$(find out -name MainActivity.kt -print -quit)"

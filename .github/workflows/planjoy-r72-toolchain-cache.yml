name: PlanJoy R7.2 Android Offline Toolchain
on:
  push:
    branches: [tmp-planjoy-r72-toolchain]
  workflow_dispatch:
jobs:
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Create R7.2 dependency-resolution project
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf android_native
          mkdir -p android_native/app/src/main/java/app/planjoy/cache android_native/app/src/main/res/values
          cat > android_native/settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name="PlanJoyR72Cache"
          include(":app")
          EOF
          cat > android_native/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "9.3.0" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.2.10" apply false
          }
          EOF
          cat > android_native/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          EOF
          cat > android_native/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace="app.planjoy.cache"
              compileSdk=37
              defaultConfig { applicationId="app.planjoy.cache"; minSdk=26; targetSdk=37; versionCode=1; versionName="1" }
              flavorDimensions += "install"
              productFlavors {
                  create("production") { dimension = "install" }
                  create("cleanTest") { dimension = "install"; applicationIdSuffix = ".clean" }
              }
              buildFeatures { compose=true }
              buildTypes { release { isMinifyEnabled=true; isShrinkResources=true; proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"),"proguard-rules.pro") } }
          }
          dependencies {
              val bom=platform("androidx.compose:compose-bom:2026.08.00")
              implementation(bom)
              androidTestImplementation(bom)
              implementation("androidx.activity:activity-compose:1.13.0")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          EOF
          : > android_native/app/proguard-rules.pro
          cat > android_native/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:theme="@style/AppTheme"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          cat > android_native/app/src/main/res/values/styles.xml <<'EOF'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"/></resources>
          EOF
          cat > android_native/app/src/main/java/app/planjoy/cache/MainActivity.kt <<'EOF'
          package app.planjoy.cache
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.material3.Text
          class MainActivity: ComponentActivity(){ override fun onCreate(savedInstanceState: Bundle?){ super.onCreate(savedInstanceState); setContent { Text("PlanJoy R7.2 cache") } } }
          EOF
      - name: Resolve exact R7.2 Android and Compose dependencies without dex merge
        working-directory: android_native
        run: |
          gradle --no-daemon --stacktrace :app:compileProductionDebugKotlin :app:compileProductionReleaseKotlin :app:processProductionDebugResources :app:processProductionReleaseResources :app:lintProductionDebug
      - name: Package offline build toolchain
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p offline-toolchain/android-sdk/platforms offline-toolchain/android-sdk/build-tools offline-toolchain/android-sdk/platform-tools offline-toolchain/gradle-user-home
          GRADLE_BIN=$(readlink -f "$(command -v gradle)")
          GRADLE_HOME=$(dirname "$(dirname "$GRADLE_BIN")")
          cp -a "$GRADLE_HOME" offline-toolchain/gradle-9.5.0
          test -d "$ANDROID_HOME/platforms/android-37"
          cp -a "$ANDROID_HOME/platforms/android-37" offline-toolchain/android-sdk/platforms/
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -n "$BT"
          cp -a "$BT" offline-toolchain/android-sdk/build-tools/
          cp -a "$ANDROID_HOME/platform-tools/." offline-toolchain/android-sdk/platform-tools/
          cp -a "$HOME/.gradle/caches" offline-toolchain/gradle-user-home/
          if [ -d "$HOME/.gradle/notifications" ]; then cp -a "$HOME/.gradle/notifications" offline-toolchain/gradle-user-home/; fi
          printf 'gradle=9.5.0\nagp=9.3.0\nkotlin_compose=2.2.10\ncompileSdk=37\ntargetSdk=37\ncompose_bom=2026.08.00\nactivity_compose=1.13.0\nbuild_tools=%s\n' "$(basename "$BT")" > offline-toolchain/metadata.txt
          du -sh offline-toolchain/*
          find offline-toolchain -type f | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: PlanJoyR72-Android-offline-toolchain
          path: offline-toolchain
          compression-level: 6
          retention-days: 1

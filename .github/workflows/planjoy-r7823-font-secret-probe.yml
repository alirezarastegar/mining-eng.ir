name: PlanJoy R7.8.23 Font Secret Probe
on:
  workflow_dispatch:
  push:
    branches: [tmp-planjoy-r7823-build]
    paths: ['.github/workflows/planjoy-r7823-font-secret-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Probe likely font secrets without exposing values
        env:
          A: ${{ secrets.PLANJOY_IRANSANS_B64 }}
          B: ${{ secrets.PLANJOY_IRANSANS_XVF_B64 }}
          C: ${{ secrets.PLANJOY_ANDROID_FONT_B64 }}
          D: ${{ secrets.PLANJOY_FONT_B64 }}
          E: ${{ secrets.IRANSANS_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for pair in 'PLANJOY_IRANSANS_B64:A' 'PLANJOY_IRANSANS_XVF_B64:B' 'PLANJOY_ANDROID_FONT_B64:C' 'PLANJOY_FONT_B64:D' 'IRANSANS_B64:E'; do
            name=${pair%%:*}; var=${pair##*:}; value=${!var:-}
            if [ -n "$value" ]; then
              echo "FOUND $name"
              found=1
            fi
          done
          if [ "$found" -eq 0 ]; then echo 'NO_FONT_SECRET_FOUND'; fi

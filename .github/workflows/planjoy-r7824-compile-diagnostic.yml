name: PlanJoy R7.8.24 Compile Diagnostic
on:
  workflow_dispatch:
  push:
    branches: [tmp-planjoy-r7823-build]
    paths: ['.github/workflows/planjoy-r7824-compile-diagnostic.yml']
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - name: SDK
        run: |
          sdkmanager --channel=3 'platform-tools' 'platforms;android-37.0' 'build-tools;37.0.0'
          [ -e "$ANDROID_SDK_ROOT/platforms/android-37" ] || ln -s "$ANDROID_SDK_ROOT/platforms/android-37.0" "$ANDROID_SDK_ROOT/platforms/android-37"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.5.0'}
      - name: Reconstruct and patch
        shell: bash
        run: |
          set -euo pipefail
          cat planjoy-r7823-source/code/chunk*.b64 | base64 -d > /tmp/src.tar.xz
          echo '9bb1f3106dbcea0ec6812e5f3c336ac8c191d4f50df81355d0c70551ea6a0aa3  /tmp/src.tar.xz' | sha256sum -c -
          mkdir android_native && tar -xJf /tmp/src.tar.xz -C android_native
          python3 planjoy-r7823-source/r7823_compile_patch.py
          cat planjoy-r7824-source/patch-xz/part*.b64 | base64 -d > /tmp/p.xz
          echo '180b2b928580d394a8dfb4c011a72dfc915d3820e7b72f52d0dd8e39452b0904  /tmp/p.xz' | sha256sum -c -
          xz -dc /tmp/p.xz > /tmp/p.patch
          echo '2fc15d41502e0526139677ccee61e70f378b25bafbf568afd4462427d8f64fdd  /tmp/p.patch' | sha256sum -c -
          patch --batch --forward -p1 -d android_native < /tmp/p.patch
      - name: Compile placeholders
        shell: bash
        run: |
          set -euo pipefail
          D=android_native/app/src/main/res/drawable; R=android_native/app/src/main/res/raw; F=android_native/app/src/main/res/font
          mkdir -p "$D" "$R" "$F"
          SYSFONT=$(find /usr/share/fonts -type f \( -iname '*.ttf' -o -iname '*.otf' \) | head -1); cp "$SYSFONT" "$F/iransans_xv.ttf"
          PNG='iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAFUlEQVR4nGP8////fwYGBgYmBigAAD34BADaOyqcAAAAAElFTkSuQmCC'
          WEBP='UklGRiQAAABXRUJQVlA4IBgAAAAwAQCdASoCAAIAAUAmJaQAA3AA/vz0AAA='
          for n in pj_original_today_header pj_original_calendar pj_original_focus_stats pj_priority_clock_duck pj_priority_focus_duck pj_priority_analysis; do printf '%s' "$PNG" | base64 -d > "$D/$n.png"; done
          for n in pj_original_focus_scene pj_original_task_ducks pj_priority_first_plan; do printf '%s' "$WEBP" | base64 -d > "$D/$n.webp"; done
          python3 - <<'PY'
          import wave,struct
          from pathlib import Path
          p=Path('android_native/app/src/main/res/raw')
          for n in ['complete','focus_end','focus_start','page_turn','pause','reward_chime','soft_bell','soft_pop']:
            with wave.open(str(p/(n+'.wav')),'wb') as w: w.setnchannels(1);w.setsampwidth(2);w.setframerate(8000);w.writeframes(struct.pack('<h',0)*80)
          PY
      - name: Capture exact Kotlin errors
        id: compile
        continue-on-error: true
        working-directory: android_native
        shell: bash
        run: |
          set +e
          gradle :app:compileProductionReleaseKotlin --no-daemon --no-build-cache --stacktrace > ../compile-full.log 2>&1
          rc=$?
          grep -E '^e: | error: |Compilation error|Unresolved reference|Cannot infer|No value passed|Type mismatch' ../compile-full.log > ../compile-errors.txt || true
          tail -160 ../compile-full.log > ../compile-tail.txt
          echo "exit_code=$rc" > ../compile-status.txt
          cat ../compile-errors.txt
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PlanJoy-R7824-Compile-Diagnostic
          retention-days: 2
          path: |
            compile-errors.txt
            compile-tail.txt
            compile-status.txt

name: PlanJoy R7.1 UX Android Build
on:
  push:
    branches: [tmp-planjoy-ux-ci]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Reconstruct isolated Android source
        shell: bash
        run: |
          git fetch --depth=1 origin tmp-planjoy-r7-build
          git checkout FETCH_HEAD -- planjoy-r7-source
          cat planjoy-r7-source/chunk*.b64 > planjoy-r7-source/source.b64
          base64 -d planjoy-r7-source/source.b64 > planjoy-r7-base.tar.gz
          echo '36dd8324b4d54e3dcacff3a6d28e2b6bb6153efcf54e337c99226cf1fdeadf11  planjoy-r7-base.tar.gz' | sha256sum -c -
          tar -xzf planjoy-r7-base.tar.gz
          base64 -d planjoy-r71-ux/patch.tar.gz.b64 > planjoy-r71-ux/patch.tar.gz
          echo '2e0a60663c32d9d86b7a7f9437d86627b073df70a1a03263e1156648b809b219  planjoy-r71-ux/patch.tar.gz' | sha256sum -c -
          tar -xzf planjoy-r71-ux/patch.tar.gz
          mkdir -p android_native/app/src/main/res/font
          base64 -d planjoy-r71-ux/font-placeholder.ttf.b64 > android_native/app/src/main/res/font/iransans_xv.ttf
          test -f android_native/app/src/main/java/com/planjoy/r7/AppUi.kt
      - name: Build and lint
        working-directory: android_native
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:lintDebug
      - name: Verify package
        shell: bash
        run: |
          test -f android_native/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android_native/app/build/outputs/apk/debug/app-debug.apk | tee PlanJoyR71-APK-SHA256.txt
          ! grep -q 'Error:' android_native/app/build/reports/lint-results-debug.txt
          printf 'compileSdk=37\ntargetSdk=37\nversion=0.7.1\nfont=CI-placeholder-only\n' > PlanJoyR71-build-metadata.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PlanJoyR71-Android-debug
          path: |
            android_native/app/build/outputs/apk/debug/app-debug.apk
            android_native/app/build/reports/lint-results-debug.html
            android_native/app/build/reports/lint-results-debug.txt
            PlanJoyR71-APK-SHA256.txt
            PlanJoyR71-build-metadata.txt
          retention-days: 7

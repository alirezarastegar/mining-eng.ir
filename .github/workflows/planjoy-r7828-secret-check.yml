name: PlanJoy R7.8.28 Private Release Dependency Check

on:
  workflow_dispatch:
  push:
    branches: [tmp-planjoy-r7828-build]
    paths:
      - '.github/workflows/planjoy-r7828-secret-check.yml'

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check private release dependencies without exposing values
        shell: bash
        env:
          KS: ${{ secrets.PLANJOY_ANDROID_KEYSTORE_B64 }}
          SP: ${{ secrets.PLANJOY_ANDROID_STORE_PASSWORD }}
          KA: ${{ secrets.PLANJOY_ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.PLANJOY_ANDROID_KEY_PASSWORD }}
          FONT: ${{ secrets.PLANJOY_FONT_IRANSANSXV_TTF_B64 }}
        run: |
          set -euo pipefail
          yesno(){ if [ -n "$1" ]; then echo YES; else echo NO; fi; }
          echo "KEYSTORE_B64=$(yesno "$KS")"
          echo "STORE_PASSWORD=$(yesno "$SP")"
          echo "KEY_ALIAS=$(yesno "$KA")"
          echo "KEY_PASSWORD=$(yesno "$KP")"
          echo "PRODUCTION_FONT_B64=$(yesno "$FONT")"
          if [ -n "$FONT" ]; then
            printf '%s' "$FONT" | base64 -d > "$RUNNER_TEMP/planjoy-font.ttf"
            echo -n 'PRODUCTION_FONT_SHA256='
            sha256sum "$RUNNER_TEMP/planjoy-font.ttf" | awk '{print $1}'
            rm -f "$RUNNER_TEMP/planjoy-font.ttf"
          fi
          if [ -n "$KS" ]; then
            printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/planjoy-release.bin"
            echo "KEYSTORE_DECODE_BYTES=$(wc -c < "$RUNNER_TEMP/planjoy-release.bin")"
            rm -f "$RUNNER_TEMP/planjoy-release.bin"
          fi

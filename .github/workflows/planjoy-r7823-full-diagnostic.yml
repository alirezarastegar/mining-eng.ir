name: PlanJoy R7.8.23 Full Source Diagnostic
on:
  workflow_dispatch:
  push:
    branches: [tmp-planjoy-r7823-build]
    paths: ['.github/workflows/planjoy-r7823-full-diagnostic.yml']
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Decode, hash and inspect full source payload
        shell: bash
        run: |
          set -euo pipefail
          cat planjoy-r7823-source/full/chunk*.b64 > /tmp/r7823-full.b64
          base64 -d /tmp/r7823-full.b64 > /tmp/r7823-full.tar.xz
          echo "BYTES=$(wc -c < /tmp/r7823-full.tar.xz)"
          sha256sum /tmp/r7823-full.tar.xz
          xz -t /tmp/r7823-full.tar.xz
          tar -tJf /tmp/r7823-full.tar.xz | head -80
          mkdir -p /tmp/r7823-extract
          tar -xJf /tmp/r7823-full.tar.xz -C /tmp/r7823-extract
          find /tmp/r7823-extract -type f \( -name build.gradle.kts -o -name settings.gradle.kts -o -name r7823_windows_parity_contract.py \) -print
          ROOT=$(find /tmp/r7823-extract -type f -path '*/app/build.gradle.kts' -printf '%h\n' | sed 's#/app$##' | head -1)
          test -n "$ROOT"
          grep -E 'versionCode|versionName|compileSdk|targetSdk' "$ROOT/app/build.gradle.kts" || true
          test -f "$ROOT/tests/r7823_windows_parity_contract.py"

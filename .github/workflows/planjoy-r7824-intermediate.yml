name: PlanJoy R7.8.24 Mobile UI Restore Intermediate

on:
  workflow_dispatch:
  push:
    branches: [tmp-planjoy-r7823-build]
    paths:
      - '.github/workflows/planjoy-r7824-intermediate.yml'
      - 'planjoy-r7824-source/patch-xz/**'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 37.0 and Build Tools 37.0.0
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --channel=3 'platform-tools' 'platforms;android-37.0' 'build-tools;37.0.0'
          test -f "$ANDROID_SDK_ROOT/platforms/android-37.0/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/37.0.0/aapt2"
          if [ ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            ln -s "$ANDROID_SDK_ROOT/platforms/android-37.0" "$ANDROID_SDK_ROOT/platforms/android-37"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Reconstruct exact verified R7.8.23 source
        shell: bash
        run: |
          set -euo pipefail
          cat planjoy-r7823-source/code/chunk*.b64 > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/source.tar.xz
          echo '9bb1f3106dbcea0ec6812e5f3c336ac8c191d4f50df81355d0c70551ea6a0aa3  /tmp/source.tar.xz' | sha256sum -c -
          xz -t /tmp/source.tar.xz
          rm -rf android_native && mkdir android_native
          tar -xJf /tmp/source.tar.xz -C android_native

      - name: Apply certified R7.8.23 compile/resource bindings
        shell: bash
        run: |
          set -euo pipefail
          python3 planjoy-r7823-source/r7823_compile_patch.py

      - name: Verify and apply exact R7.8.24 repair patch
        shell: bash
        run: |
          set -euo pipefail
          cat planjoy-r7824-source/patch-xz/part*.b64 > /tmp/r7824.patch.xz.b64
          base64 -d /tmp/r7824.patch.xz.b64 > /tmp/r7824.patch.xz
          echo '180b2b928580d394a8dfb4c011a72dfc915d3820e7b72f52d0dd8e39452b0904  /tmp/r7824.patch.xz' | sha256sum -c -
          xz -t /tmp/r7824.patch.xz
          xz -dc /tmp/r7824.patch.xz > /tmp/r7824.patch
          echo '2fc15d41502e0526139677ccee61e70f378b25bafbf568afd4462427d8f64fdd  /tmp/r7824.patch' | sha256sum -c -
          patch --batch --forward -p1 -d android_native < /tmp/r7824.patch
          grep -Eq 'versionCode[[:space:]]*=[[:space:]]*78024' android_native/app/build.gradle.kts
          grep -Eq 'versionName[[:space:]]*=[[:space:]]*"0\.7\.8\+24"' android_native/app/build.gradle.kts

      - name: Create disposable CI-only compile resources
        shell: bash
        run: |
          set -euo pipefail
          D=android_native/app/src/main/res/drawable
          R=android_native/app/src/main/res/raw
          F=android_native/app/src/main/res/font
          mkdir -p "$D" "$R" "$F"
          SYSFONT=$(find /usr/share/fonts -type f \( -iname '*.ttf' -o -iname '*.otf' \) | head -1)
          test -n "$SYSFONT" && cp "$SYSFONT" "$F/iransans_xv.ttf"
          PNG='iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAFUlEQVR4nGP8////fwYGBgYmBigAAD34BADaOyqcAAAAAElFTkSuQmCC'
          WEBP='UklGRiQAAABXRUJQVlA4IBgAAAAwAQCdASoCAAIAAUAmJaQAA3AA/vz0AAA='
          for n in pj_original_today_header pj_original_calendar pj_original_focus_stats pj_priority_clock_duck pj_priority_focus_duck pj_priority_analysis; do printf '%s' "$PNG" | base64 -d > "$D/$n.png"; done
          for n in pj_original_focus_scene pj_original_task_ducks pj_priority_first_plan; do printf '%s' "$WEBP" | base64 -d > "$D/$n.webp"; done
          python3 - <<'PY'
          import wave, struct
          from pathlib import Path
          root=Path('android_native/app/src/main/res/raw')
          for name in ['complete','focus_end','focus_start','page_turn','pause','reward_chime','soft_bell','soft_pop']:
              with wave.open(str(root/(name+'.wav')),'wb') as w:
                  w.setnchannels(1); w.setsampwidth(2); w.setframerate(8000); w.writeframes(struct.pack('<h',0)*80)
          PY

      - name: Run R7.8.24 mobile UI/reward regression contract
        working-directory: android_native
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/r7824_mobile_ui_restore_contract.py | tee ../r7824-contract.txt
          grep -q 'SUMMARY 28/28 PASS' ../r7824-contract.txt

      - name: Build and lint production release
        working-directory: android_native
        shell: bash
        run: |
          set -euo pipefail
          gradle clean :app:compileProductionReleaseKotlin :app:assembleProductionRelease :app:lintProductionRelease --no-daemon --no-build-cache --stacktrace
          test -f app/build/reports/lint-results-productionRelease.txt
          ! grep -q ': Error:' app/build/reports/lint-results-productionRelease.txt
          APK=$(find app/build/outputs/apk/production/release -name '*.apk' -type f | head -1)
          test -n "$APK" && test -f "$APK"
          "$ANDROID_SDK_ROOT/build-tools/37.0.0/zipalign" -f -P 16 -v 4 "$APK" ../PlanJoyR7824-Android-INTERMEDIATE-ALIGNED.apk
          "$ANDROID_SDK_ROOT/build-tools/37.0.0/zipalign" -c -P 16 -v 4 ../PlanJoyR7824-Android-INTERMEDIATE-ALIGNED.apk
          "$ANDROID_SDK_ROOT/build-tools/37.0.0/aapt2" dump badging ../PlanJoyR7824-Android-INTERMEDIATE-ALIGNED.apk | tee ../r7824-badging.txt
          grep -q "package: name='app.planjoy.local' versionCode='78024' versionName='0.7.8+24'" ../r7824-badging.txt

      - name: Package clean source skeleton without binary placeholders
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/PlanJoyR7824-Android-Source"
          rm -rf "$OUT" && cp -a android_native "$OUT"
          find "$OUT" -type d \( -name build -o -name .gradle \) -prune -exec rm -rf {} +
          find "$OUT" -type f \( -iname '*.ttf' -o -iname '*.otf' -o -iname '*.p12' -o -iname '*.pfx' -o -iname '*.jks' -o -iname '*.keystore' \) -delete
          rm -f "$OUT/app/src/main/res/drawable/pj_original_today_header.png" "$OUT/app/src/main/res/drawable/pj_original_calendar.png" "$OUT/app/src/main/res/drawable/pj_original_focus_stats.png" "$OUT/app/src/main/res/drawable/pj_original_focus_scene.webp" "$OUT/app/src/main/res/drawable/pj_original_task_ducks.webp"
          rm -f "$OUT/app/src/main/res/drawable/pj_priority_clock_duck.png" "$OUT/app/src/main/res/drawable/pj_priority_focus_duck.png" "$OUT/app/src/main/res/drawable/pj_priority_first_plan.webp" "$OUT/app/src/main/res/drawable/pj_priority_analysis.png"
          rm -rf "$OUT/app/src/main/res/raw"
          cat > "$OUT/FONT-ASSET-NOT-INCLUDED.md" <<'EOF'
          # Font asset
          The authorized binary font is intentionally omitted from this source distribution.
          Production expects app/src/main/res/font/iransans_xv.ttf.
          EOF
          (cd "$RUNNER_TEMP" && zip -qr "$GITHUB_WORKSPACE/PlanJoyR7824-Android-Source-Skeleton.zip" PlanJoyR7824-Android-Source)
          sha256sum PlanJoyR7824-Android-Source-Skeleton.zip > PlanJoyR7824-Android-Source-Skeleton-SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PlanJoy-R7824-Intermediate
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
          path: |
            PlanJoyR7824-Android-INTERMEDIATE-ALIGNED.apk
            PlanJoyR7824-Android-Source-Skeleton.zip
            PlanJoyR7824-Android-Source-Skeleton-SHA256.txt
            r7824-contract.txt
            r7824-badging.txt
            android_native/app/build/reports/lint-results-productionRelease.txt
            android_native/app/build/reports/lint-results-productionRelease.html

name: PlanJoy R7.8.23 Android 17 SDK Probe
on:
  push:
    branches: [tmp-planjoy-r7823-build]
    paths: ['.github/workflows/planjoy-r7823-sdk37-diagnostic.yml']
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: List Android 17 packages across channels
        shell: bash
        run: |
          set -euo pipefail
          echo '=== channel 3 relevant packages ==='
          sdkmanager --channel=3 --list | grep -Ei 'platforms;android-(37|cinnamon)|build-tools;37' || true
          echo '=== android cli availability ==='
          command -v android || true
          android sdk list 2>/dev/null | grep -Ei '37|cinnamon' || true

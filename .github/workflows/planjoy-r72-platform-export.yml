name: PlanJoy R7.2 Android Platform Export
on:
  push:
    branches: [tmp-planjoy-r72-toolchain]
  workflow_dispatch:
jobs:
  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export exact compile SDK platform
        shell: bash
        run: |
          set -euxo pipefail
          MATCH="$ANDROID_HOME/platforms/android-37.0"
          test -f "$MATCH/android.jar"
          mkdir -p offline-platform/platforms
          cp -a "$MATCH" offline-platform/platforms/
          basename "$MATCH" | tee offline-platform/platform-name.txt
          du -sh offline-platform
      - uses: actions/upload-artifact@v4
        with:
          name: PlanJoyR72-Android-platform-37.0
          path: offline-platform
          retention-days: 1
